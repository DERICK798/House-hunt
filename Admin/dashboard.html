<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#315c45" />
  <title>Admin dashboard | Haven</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1e2b25;
      --muted: #607168;
      --green: #315c45;
      --green-dark: #244735;
      --paper: #f5f7f3;
      --panel: #ffffff;
      --line: #e4e9e2;
      --warning-bg: #fff7e7;
      --warning-text: #8c5d10;
      --success-bg: #ebf8f1;
      --success-text: #246c4a;
      --danger-bg: #fff1ef;
      --danger-text: #9a4039;
      --neutral-bg: #edf1ef;
      --neutral-text: #4a5a53;
      --shadow: 0 18px 45px rgba(17, 28, 23, 0.06);
      font-family: Inter, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; }

    .container {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
      background: rgba(245, 247, 243, 0.9);
      border-bottom: 1px solid var(--line);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      height: 78px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.7px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      background: var(--green);
      color: white;
      border-radius: 11px;
    }

    .brand-mark svg { width: 18px; height: 18px; }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .admin-name {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .button {
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      color: var(--green-dark);
      font-weight: 700;
      cursor: pointer;
    }

    .button.primary {
      border-color: transparent;
      background: var(--green);
      color: white;
    }

    .button.primary:hover { background: var(--green-dark); }

    .button:hover { background: #f1f4ef; }

    main {
      padding: 36px 0 70px;
    }

    .hero {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 24px;
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 10px;
      color: var(--green);
      font-size: 12px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      font-weight: 800;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 4vw, 50px);
      letter-spacing: -2px;
    }

    .hero-note {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .summary-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px 18px 16px;
      box-shadow: var(--shadow);
    }

    .summary-card span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .summary-card strong {
      display: block;
      margin-top: 10px;
      font-size: clamp(24px, 2.6vw, 30px);
      letter-spacing: -1px;
    }

    .summary-card.warning {
      background: var(--warning-bg);
      border-color: #f0dfc2;
    }
    .summary-card.warning strong { color: var(--warning-text); }

    .summary-card.success {
      background: var(--success-bg);
      border-color: #cfe7d8;
    }
    .summary-card.success strong { color: var(--success-text); }

    .summary-card.danger {
      background: var(--danger-bg);
      border-color: #f1d8d4;
    }
    .summary-card.danger strong { color: var(--danger-text); }

    .summary-card.neutral {
      background: var(--neutral-bg);
      border-color: #dfe7e1;
    }
    .summary-card.neutral strong { color: var(--neutral-text); }

    .queue-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 22px;
      box-shadow: var(--shadow);
    }

    .queue-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .queue-toolbar h2 {
      margin: 0;
      font-size: 20px;
      letter-spacing: -0.5px;
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .filter-button {
      min-height: 36px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #f5f7f4;
      color: var(--muted);
      font-weight: 700;
      cursor: pointer;
    }

    .filter-button.active {
      background: var(--green);
      border-color: var(--green);
      color: white;
    }

    .notice {
      min-height: 24px;
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .notice.error { color: var(--danger-text); }

    .property-list {
      display: grid;
      gap: 16px;
    }

    .property-card {
      display: grid;
      grid-template-columns: 200px minmax(0, 1fr);
      gap: 18px;
      background: #fafcf9;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
    }

    .property-media {
      width: 100%;
      height: 180px;
      border-radius: 12px;
      overflow: hidden;
      background: #edf2ed;
      border: 1px solid #e4e8e3;
    }

    .property-media img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .property-body {
      min-width: 0;
    }

    .property-topline {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    .property-topline h3 {
      margin: 0;
      font-size: 21px;
      letter-spacing: -0.7px;
    }

    .property-topline p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .status {
      padding: 7px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.2px;
      text-transform: capitalize;
      white-space: nowrap;
    }

    .status-pending {
      background: var(--warning-bg);
      color: var(--warning-text);
    }

    .status-approved {
      background: var(--success-bg);
      color: var(--success-text);
    }

    .status-rejected {
      background: var(--danger-bg);
      color: var(--danger-text);
    }

    .property-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .property-description {
      margin: 0 0 16px;
      color: #4d5d56;
      font-size: 13px;
      line-height: 1.7;
    }

    .property-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .property-contacts {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .property-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .action-btn {
      min-height: 36px;
      padding: 0 13px;
      border: 1px solid transparent;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .action-btn.approve {
      border-color: #cfe7d8;
      background: var(--success-bg);
      color: var(--success-text);
    }

    .action-btn.reject {
      border-color: #f1d8d4;
      background: var(--danger-bg);
      color: var(--danger-text);
    }

    .finalized {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 0 12px;
      background: #eef2ef;
      border-radius: 9px;
      color: var(--muted);
      font-weight: 700;
      font-size: 12px;
    }

    .empty-state {
      padding: 22px 18px;
      border: 1px dashed var(--line);
      border-radius: 12px;
      background: #fafcf9;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
      line-height: 1.7;
    }

    .empty-state strong {
      display: block;
      margin-bottom: 4px;
      color: var(--ink);
      font-size: 17px;
      letter-spacing: -0.4px;
    }

    @media (max-width: 860px) {
      .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .property-card { grid-template-columns: 1fr; }
      .property-media { height: 220px; }
    }

    @media (max-width: 540px) {
      .container { width: min(100% - 28px, 520px); }
      .header { height: 68px; }
      .hero { display: block; }
      .summary-grid { grid-template-columns: 1fr; }
      .queue-toolbar { display: block; }
      .queue-toolbar h2 { margin-bottom: 12px; }
      .filter-bar { margin-top: 10px; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="container header">
      <a class="brand" href="../Frontend/Home.html" aria-label="Haven home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="m3.5 11 8.5-7 8.5 7v8.5a1 1 0 0 1-1 1h-5.2v-6.1H9.7v6.1H4.5a1 1 0 0 1-1-1V11Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        Haven
      </a>

      <div class="header-actions">
        <span class="admin-name" id="admin-user-name">Administrator</span>
        <button type="button" class="button" id="admin-signout">Sign out</button>
      </div>
    </div>
  </div>

  <main>
    <div class="container">
      <section class="hero">
        <div>
          <span class="eyebrow">Admin dashboard</span>
          <h1>Property review board</h1>
          <p class="hero-note">Review incoming listings, approve valid homes, and reject incomplete submissions.</p>
        </div>
        <button type="button" class="button primary" onclick="window.location.href='../Frontend/Home.html'">View public site</button>
      </section>

      <section id="summary-grid" class="summary-grid" aria-live="polite"></section>

      <section class="queue-panel">
        <div class="queue-toolbar">
          <h2>Submission queue</h2>
          <div class="filter-bar" aria-label="Property queue filters">
            <button class="filter-button active" type="button" data-filter="all">All</button>
            <button class="filter-button" type="button" data-filter="pending">Pending</button>
            <button class="filter-button" type="button" data-filter="approved">Approved</button>
            <button class="filter-button" type="button" data-filter="rejected">Rejected</button>
          </div>
        </div>

        <div id="admin-property-notice" class="notice" aria-live="polite">Loading submissions...</div>
        <div id="admin-property-list" class="property-list" aria-live="polite"></div>
      </section>
    </div>
  </main>

  <script src="admin.js"></script>
</body>
</html>
